name: Medicon CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Python ML Microservice Test Suite
  ml-service-tests:
    name: ML Service Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Baseline Model Artifact
        working-directory: ./ml-service
        run: python train.py

      - name: Run Pytest Test Suite
        working-directory: ./ml-service
        run: pytest tests/ -v --color=yes

  # 2. Laravel 11 Backend Test Suite
  backend-tests:
    name: Laravel 11 Tests (PHPUnit + SQLite)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, redis, bcmath, gd
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File
        working-directory: ./backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute PHPUnit Feature & Unit Tests
        working-directory: ./backend
        run: php artisan test --colors=always

  # 3. Vue 3 Frontend Compilation & Linting
  frontend-build:
    name: Frontend Build (Vue 3 + Vite + Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build
