version: '3.8'

services:
  # Hardened Nginx Production Edge Server
  nginx:
    image: nginx:1.25-alpine
    container_name: medicon-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ml-service
    networks:
      - medicon-prod-network

  # Hardened PHP 8.2 FPM Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicon-prod-backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      APP_NAME: "Medicon Telehealth"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://medicon.health}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: medicon_prod
      DB_USERNAME: ${DB_USERNAME:-medicon_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-medicon-prod-records}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT: 2.5
    depends_on:
      - db
      - redis
    networks:
      - medicon-prod-network

  # Production Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicon-prod-queue
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: medicon_prod
      DB_USERNAME: ${DB_USERNAME:-medicon_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
      - redis
    networks:
      - medicon-prod-network

  # Python FastAPI ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: medicon-prod-ml
    restart: always
    environment:
      MODEL_PATH: "/app/models/noshow_model_v1.joblib"
      METRICS_PATH: "/app/models/metrics.json"
      HIGH_RISK_THRESHOLD: "0.65"
      MEDIUM_RISK_THRESHOLD: "0.35"
      PORT: 8000
    networks:
      - medicon-prod-network

  # MySQL 8.0 Enterprise Database
  db:
    image: mysql:8.0
    container_name: medicon-prod-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: medicon_prod
      MYSQL_USER: ${DB_USERNAME:-medicon_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - medicon-prod-db-data:/var/lib/mysql
    networks:
      - medicon-prod-network

  # Redis 7.2 Cache
  redis:
    image: redis:7.2-alpine
    container_name: medicon-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_pass}
    volumes:
      - medicon-prod-redis-data:/data
    networks:
      - medicon-prod-network

networks:
  medicon-prod-network:
    driver: bridge

volumes:
  medicon-prod-db-data:
  medicon-prod-redis-data:
